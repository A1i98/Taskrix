[package]
name = "taskrix"
version = "0.1.1"
edition = "2021"

[dependencies]
matrix-sdk = { version = "0.11", default-features = false, features = ["bundled-sqlite", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true