name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: taskrix

jobs:
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build x86_64-unknown-linux-gnu
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Build aarch64-unknown-linux-gnu (cross)
        run: cross build --release --locked --target aarch64-unknown-linux-gnu

      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            stage="dist/stage-${target}"
            rm -rf "$stage"
            mkdir -p "$stage"
            cp "target/${target}/release/${BIN_NAME}" "$stage/"
            cp README.md "$stage/" || true
            tar -C "$stage" -czf "dist/${BIN_NAME}-${{ github.ref_name }}-${target}.tar.gz" .
            (cd dist && (sha256sum "${BIN_NAME}-${{ github.ref_name }}-${target}.tar.gz" > "${BIN_NAME}-${target}.sha256" || shasum -a 256 "${BIN_NAME}-${{ github.ref_name }}-${target}.tar.gz" > "${BIN_NAME}-${target}.sha256"))
          done

      - name: Upload artifacts (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-linux
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Build (release)
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package (tar.gz)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          stage="dist/stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "target/aarch64-apple-darwin/release/${BIN_NAME}" "$stage/"
          cp README.md "$stage/" || true
          tar -C "$stage" -czf "dist/${BIN_NAME}-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" .
          (cd dist && (sha256sum "${BIN_NAME}-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" > "taskrix-aarch64-apple-darwin.sha256" || shasum -a 256 "${BIN_NAME}-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz" > "taskrix-aarch64-apple-darwin.sha256"))

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-aarch64-apple-darwin
          path: dist/*
          if-no-files-found: error

  build-windows:
    name: Build (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build (release)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $stage = "dist/stage"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/$env:BIN_NAME.exe" "$stage/"
          Copy-Item "README.md" "$stage/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$env:BIN_NAME-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip" -Force
          $hash = Get-FileHash "dist/$env:BIN_NAME-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  $env:BIN_NAME-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip" | Out-File -Encoding ascii "dist/taskrix-x86_64-pc-windows-msvc.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -R dist

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
